<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Lead Generation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }

        .container h1 {
            color: #1c8ef9;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .container p {
            color: #333;
            font-size: 16px;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 8px;
        }

        .cta {
            margin-top: 15px;
        }

        .cta button {
            background-color: #1c8ef9;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            
        }

        .cta button:hover {
            background-color: #005bb5;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Join Us to Stay Updated </h1>
        <p>Fill out the form below to share your WhatsApp number and stay updated with our latest offers and updates!</p>
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScZchfpqaa2UQ15FBooB0vqy0gAyOGf8gMBTMyxGKn3Knfnww/viewform?embedded=true" frameborder="0">Loading…</iframe>
        <div class="cta">
            <button onclick="window.location.href='https://wa.me/YOUR_WHATSAPP_NUMBER'">Chat with Us Now on WhatsApp</button>
        </div>
        <footer>
            &copy; 2025 Your Company. All rights reserved.
        </footer>
    </div>

</body>
</html>
