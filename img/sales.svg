<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line1 { fill: none; stroke: #00cfff; stroke-width: 4; }
      .line2 { fill: none; stroke: #feca52; stroke-width: 4; }
      .legend { font-family: sans-serif; font-size: 16px; fill: white; }
      .dollar-circle { fill: #9ff; stroke: none; }
      .dollar-text { font-size: 18px; font-weight: bold; fill: #333; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#3e0f72" />
    <stop offset="100%" stop-color="#6a1cc6" />
  </linearGradient>

  <!-- Data Lines -->
  <path class="line1" d="M50 300 Q150 150 250 250 T450 100 T650 200 T750 180" />
  <path class="line2" d="M50 310 Q150 200 250 220 T450 240 T650 260 T750 300" />

  <!-- Dollar Markers (New Random Positions) -->
  <circle class="dollar-circle" cx="180" cy="180" r="20" />
  <circle class="dollar-circle" cx="520" cy="60" r="25" />
  <circle class="dollar-circle" cx="700" cy="280" r="18" />
  <text class="dollar-text" x="180" y="180">$</text>
  <text class="dollar-text" x="520" y="60">$</text>
  <text class="dollar-text" x="700" y="280">$</text>

  <!-- Legend -->
  <rect x="50" y="20" width="20" height="5" fill="#00cfff"/>
  <text class="legend" x="80" y="25">Blue Line</text>
  <rect x="200" y="20" width="20" height="5" fill="#feca52"/>
  <text class="legend" x="230" y="25">Yellow Line</text>
</svg>
